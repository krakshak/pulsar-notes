name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx numpy scipy pydantic pytest pytest-asyncio uvicorn

      - name: Run platform-independent test suite
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          DO_NOT_TRACK: "1"
          ANONYMIZED_TELEMETRY: "False"
          OLLAMA_NOHISTORY: "1"
          OLLAMA_DEBUG: "0"
        run: |
          pytest -v \
            tests/test_phase1_db_and_config.py \
            tests/test_phase2_audio_engine.py \
            tests/test_phase4_summarizer.py \
            tests/test_phase5_api_and_security.py \
            tests/test_phase6_frontend_assets.py
